tasks:
  precedence:
    commands:
      - '{env.ENV_1}, {env.ENV_2}, {env.ENV_3}, {env.ENV_4}'
    environment:
      ENV_1: 'from task_env_1'
    env_file: 'tests/resources/env_task_file'
  empty:
    commands:
      - '{env.empty}'
    env_file: 'tests/resources/env_task_file'
  eq_no_quote:
    commands:
      - '{env.eq_no_quote}'
  spaces:
    commands:
      - '{env.spaces}'
  trim:
    commands:
      - '{env.trim}'
environment:
  ENV_1: 'from env_1'
  ENV_2: 'from env_2'
  ENV_3: 'from env_3'
  global_env: 'global_env value'
env_file: 'tests/resources/env_file'

notification:
  slack:
    url: '{env.global_env}'
    channel: '{env.global_env}'
    emoji: '{env.global_env}'
    username: '{env.global_env}'
  discord:
    url: '{env.global_env}'
    username: '{env.global_env}'
  print:
    output: '{env.global_env}'
  email:
    from:
      name: '{env.global_env}'
      address: '{env.global_env}'
    to:
      - name: '{env.global_env}'
        address: '{env.global_env}'
    subject: '{env.global_env}'
    smtp:
      hostname: '{env.global_env}'
      port: 1587
      username: '{env.global_env}'
      secret: '{env.global_env}'
      tls: false
